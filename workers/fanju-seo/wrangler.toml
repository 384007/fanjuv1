name = "fanju-seo-worker"
main = "worker.js"
compatibility_date = "2026-05-17"

# Routes intentionally empty.
# /city/* and /en/city/* are served directly by Cloudflare Pages
# from the static Next.js export — no runtime AI rendering, no AI translation.
# D1/R2 bindings are kept so the worker can still be reused later if needed.
routes = []

[vars]
ORIGIN_BASE = "https://fanju.pages.dev"

[[d1_databases]]
binding = "FANJU_DB"
database_name = "fanju-seo-prod"
database_id = "58d63133-adeb-4efd-b9eb-a9b056271ca5"

[[r2_buckets]]
binding = "FANJU_ARTICLES"
bucket_name = "fanju-articles-prod"
