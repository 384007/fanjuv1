name = "fanju-seo-worker"
main = "worker.js"
compatibility_date = "2026-05-17"

# City routes render ready D1/R2 articles first, then proxy to the static
# Cloudflare Pages export. The Worker does not generate fallback article text.
routes = [
  { pattern = "fanju.app/city/*", zone_name = "fanju.app" },
  { pattern = "fanju.app/en/city/*", zone_name = "fanju.app" },
]

[vars]
ORIGIN_BASE = "https://fanjuv1.pages.dev"

[[d1_databases]]
binding = "FANJU_DB"
database_name = "fanju-seo-prod"
database_id = "58d63133-adeb-4efd-b9eb-a9b056271ca5"

[[r2_buckets]]
binding = "FANJU_ARTICLES"
bucket_name = "fanju-articles-prod"
