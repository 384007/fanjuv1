<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="饭反 Fanju">
  <defs>
    <linearGradient id="purpleRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="#0a0a0a"/>
  <!-- 饭 - single character mark for small header icon -->
  <text 
    x="64" 
    y="82" 
    font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
    font-size="82" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#purpleRed)" 
    stroke="url(#goldBevel)" 
    stroke-width="8" 
    stroke-linejoin="round" 
